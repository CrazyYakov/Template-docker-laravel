version: "3"

services:
  app:
    env_file:
      - .env
    tty: true
    build:
      context: context/app
      args:
        - COMPOSER_URL=${COMPOSER_URL}
        - USER_NAME=${USER_NAME}
        - USER_ID=${USER_ID}
        - APP_ENV=${APP_ENV}
    restart: on-failure
    working_dir: /var/www/app
    volumes:
      - ../app:/var/www/app
    networks:
      - app
    depends_on:
      - mysql
    environment:
      - MYSQL_DATABASE:${MYSQL_DATABASE}
      - MYSQL_USER:${MYSQL_USER}
      - MYSQL_PASSWORD:${MYSQL_PASSWORD}
    entrypoint: ["/bin/sh", "/var/www/entrypoint.sh"]
    deploy:
      resources:
        limits:
          cpus: '6.0'
          memory: '6144M'
        reservations:
          cpus: '6.0'
          memory: '6144M'
  mysql:
    env_file:
      - .env
    tty: true
    build:
      context: context/mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD:{MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE:${MYSQL_DATABASE}
      - MYSQL_USER:${MYSQL_USER}
      - MYSQL_PASSWORD:${MYSQL_USER}
    volumes:
      - database:/var/lib/mysql
    ports:
      - ${MYSQL_PORT}:3306
    networks:
      - app
  nginx:
    tty: true
    env_file:
      - .env
    build:
      context: context/nginx
    restart: on-failure
    depends_on:
      - app
    ports:
      - ${SERVER_PORT}:80
    volumes:
      - ../app:/var/www/app
      - ../logs/nginx:/var/log/nginx/
    networks:
      - app
    environment:
      - SERVER_HOSTNAME=${SERVER_HOSTNAME}
networks:
  app:
    driver: bridge
volumes:
  database:
