version: "3.9"

services:
  app:
    container_name: ${DOCKER_CONTAINER_NAME:-template}_APP
    build:
      context: ../..
      dockerfile: docker/production/Dockerfile
      args:
        PHP_VERSION: ${DOCKER_PHP_VERSION:-8.3}
    image: ${DOCKER_CONTAINER_NAME:-template}:prod
    restart: unless-stopped
    working_dir: /var/www/app
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-app}
      DB_USERNAME: ${DB_USERNAME:-user}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      CACHE_STORE: redis
      REDIS_HOST: cache
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      PHP_OPCACHE_ENABLE: "1"
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - app

  database:
    container_name: ${DOCKER_CONTAINER_NAME:-template}_DATABASE
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-app}
      POSTGRES_USER: ${DB_USERNAME:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - ./data/database:/var/lib/postgresql/data
    ports:
      - "${DOCKER_PUBLIC_DB_PORT:-5432}:5432"
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-user} -d ${DB_DATABASE:-app}"]
      interval: 10s
      timeout: 5s
      retries: 10

  cache:
    container_name: ${DOCKER_CONTAINER_NAME:-template}_CACHE
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/cache:/data
    networks:
      - app
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    container_name: ${DOCKER_CONTAINER_NAME:-template}_SERVER
    image: nginx:1-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${DOCKER_PUBLIC_SERVER_PORT:-80}:80"
    volumes:
      - ../..:/var/www/app:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app

networks:
  app:
    driver: bridge
